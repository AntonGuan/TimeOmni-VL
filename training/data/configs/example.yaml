reasoning:
  dataset_names:
    - reasoning_thinking
  num_used_data:
    - number_of_used_data
  weight: 1.0
  is_mandatory: true
  use_system_prompt: true
  image_transform_args:
    image_stride: 14
    max_image_size: 896
    min_image_size: 896
    max_pixels: 2_007_040
  frame_sampler_args:
    max_num_frames: 12
    min_num_frames: 8
  shuffle_lines: true
  shuffle_seed: 42

